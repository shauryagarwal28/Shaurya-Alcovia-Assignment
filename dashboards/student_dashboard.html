*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 56px}

.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:550}

.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}

.grid{display:grid;gap:14px}

<script>const NS='http://www.w3.org/2000/svg';
function setAttrs(e,a){for(const k in (a||{})){const v=a[k];if(v==null||v===false)continue;
 if(k==='class')e.setAttribute('class',v);else if(k==='text')e.textContent=v;
 else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
 else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else e.setAttribute(k,v);}}
function add(e,kids){for(const k of kids.flat(Infinity)){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)));}}
function h(tag,attrs,...kids){const e=document.createElement(tag);setAttrs(e,attrs);add(e,kids);return e;}
function s(tag,attrs,...kids){const e=document.createElementNS(NS,tag);setAttrs(e,attrs);add(e,kids);return e;}
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const nf=new Intl.NumberFormat('en-IN');
const fmtN=n=>nf.format(Math.round(n));
function fmtINR(n){const a=Math.abs(n);if(a>=1e7)return '₹'+(n/1e7).toFixed(2)+' Cr';if(a>=1e5)return '₹'+(n/1e5).toFixed(1)+' L';if(a>=1e4)return '₹'+(n/1e3).toFixed(0)+'K';return '₹'+fmtN(n);}
const pct=(x,d=1)=>(x*100).toFixed(d)+'%';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=d=>d.getDate()+' '+MON[d.getMonth()];
function compactTick(v){if(v>=1e7)return (v/1e7)+'Cr';if(v>=1e5)return (v/1e5)+'L';if(v>=1e3)return (v/1e3)+'K';return String(v);}
function niceMax(v){if(!(v>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;const n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return n*p;}

/* tooltip: values lead, labels follow; textContent only */
const tip=h('div',{class:'tip',role:'status'});document.body.append(tip);
function moveTip(e){const pad=14;let x=e.clientX+pad,y=e.clientY+pad;const r=tip.getBoundingClientRect();
 if(x+r.width>innerWidth-8)x=e.clientX-r.width-pad;if(y+r.height>innerHeight-8)y=e.clientY-r.height-pad;
 tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px';}
function showTip(e,title,rows){tip.replaceChildren(h('div',{class:'tip-t'},title));
 rows.forEach(r=>tip.append(h('div',{class:'tip-r'},r.color?h('span',{class:'tip-k',style:{background:r.color}}):null,h('strong',{},r.value),h('span',{class:'tip-l'},r.label||''))));
 tip.style.display='block';moveTip(e);}
function hideTip(){tip.style.display='none';}
function hover(node,title,rows){const f=e=>showTip(e,typeof title==='function'?title():title,typeof rows==='function'?rows():rows);
 node.addEventListener('pointerenter',f);node.addEventListener('pointermove',moveTip);node.addEventListener('pointerleave',hideTip);
 node.addEventListener('focus',()=>{const r=node.getBoundingClientRect();f({clientX:r.left+r.width/2,clientY:r.top});});
 node.addEventListener('blur',hideTip);node.setAttribute('tabindex','0');}

/* responsive svg: redraw at the container's real width */
function responsive(draw){const box=h('div',{style:{width:'100%'}});let last=0;
 const go=()=>{const w=Math.floor(box.clientWidth);if(!w||w===last)return;last=w;box.replaceChildren(draw(w));};
 if(window.ResizeObserver)new ResizeObserver(go).observe(box);else addEventListener('resize',go);
 requestAnimationFrame(go);return box;}

function barPath(x,y,w,hh,r){if(hh<=0)return '';r=Math.min(r,w/2,hh);return `M${x},${y+hh}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+hh}Z`;}
function hPath(x,y,w,hh,r){if(w<=0)return '';r=Math.min(r,hh/2,w);return `M${x},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+hh-r}Q${x+w},${y+hh} ${x+w-r},${y+hh}H${x}Z`;}

/* horizontal bars: rows [{label,value,color,text,tipTitle,tipRows,sub}] */
function hbars(rows,width,o){o=o||{};const labelW=o.labelW||Math.min(190,Math.round(width*.38)),rightW=o.rightW||90,bh=o.bh||18,gap=o.gap||12;
 const max=o.max||Math.max(...rows.map(r=>r.value))||1;const H=rows.length*(bh+gap)+6;const pw=Math.max(40,width-labelW-rightW);
 const svg=s('svg',{width,height:H,role:'img','aria-label':o.aria||'Bar chart'});
 rows.forEach((r,i)=>{const y=i*(bh+gap)+4;const g=s('g',{});
  g.append(s('text',{x:0,y:y+bh/2+4,class:'lab'},r.label.length>34&&labelW<200?r.label.slice(0,32)+'…':r.label));
  g.append(s('line',{x1:labelW,x2:labelW,y1:y-3,y2:y+bh+3,stroke:cssv('--axis')}));
  const w=Math.max(0,r.value/max*pw);
  g.append(s('path',{d:hPath(labelW,y,w,bh,4),fill:r.color||cssv('--s1')}));
  g.append(s('text',{x:labelW+w+8,y:y+bh/2+4,class:'val'},r.text));
  const hit=s('rect',{x:0,y:y-gap/2,width,height:bh+gap,fill:'transparent'});if(r.tipRows)hover(hit,r.tipTitle||r.label,r.tipRows);g.append(hit);svg.append(g);});
 return svg;}

/* sparkline: de-emphasis gray, current point in accent */
function spark(vals,w,hh){w=w||110;hh=hh||26;const mx=Math.max(...vals),mn=Math.min(...vals);const rg=(mx-mn)||1;
 const pts=vals.map((v,i)=>[2+i*(w-8)/(Math.max(vals.length-1,1)),hh-4-(v-mn)/rg*(hh-8)]);
 const svg=s('svg',{width:w,height:hh,'aria-hidden':'true'});
 svg.append(s('polyline',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',stroke:cssv('--muted'),'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
 const l=pts[pts.length-1];svg.append(s('circle',{cx:l[0],cy:l[1],r:4,fill:cssv('--s1'),stroke:cssv('--surface'),'stroke-width':2}));return svg;}

function delta(cur,prev,goodUp,suffix){if(!(prev>0))return h('div',{class:'d'},'No earlier period');const c=(cur-prev)/prev;const up=c>=0;
 const cls=Math.abs(c)<.005?'neutral':(up===goodUp?'up-good':'dn-bad');
 return h('div',{class:'d'},h('span',{class:cls},(up?'▲ +':'▼ ')+(c*100).toFixed(1)+'%'),h('span',{},suffix||'vs previous period'));}

function badge(kind,text){const sym={good:'✓',warn:'!',crit:'✕',mute:'•',info:'i'}[kind];return h('span',{class:'badge'},h('span',{class:'ic '+kind,'aria-hidden':'true'},sym),text);}

function chartCard(o){let mode='chart';const body=h('div',{});const head=h('div',{class:'card-h'});const card=h('div',{class:'card'},head,body);

 draw();return card;}

function legend(items){return h('div',{class:'legend'},items.map(i=>h('span',{},h('i',{style:{background:i.color}}),i.label)));}

/* theme toggle */
function themeToggle(onChange){const b=h('button',{class:'icon-btn',type:'button','aria-label':'Toggle light or dark theme'},'Theme');

/* seeded random */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

 const ctrl=h('div',{class:'seg',role:'group',style:{flexWrap:'wrap'}},opts.map(o=>h('button',{type:'button','aria-pressed':String(o.id===si),onclick:()=>{state.tsubj=o.id;render();}},o.label)));

  legend:h('div',{},ctrl,h('div',{style:{height:'8px'}}),legend([{color:cssv('--s1'),label:isStudent()?'You':s.first},...(isParent()?[]:[{color:cssv('--muted'),label:'Cohort average'}]),{color:cssv('--ink2'),label:'Target'}])),

 f.append(sectionTitle('Latest result by subject'));const k=isParent()?latestVerified(s):3;

function engagementView(){const f=h('div',{});f.append(backBtn('Back to overview',()=>go('team')));const C=[cssv('--s1'),cssv('--s2')];
 f.append(chartCard({title:'Engaged minutes per student per day',sub:'Active app time plus verified focus time, by week, against the 30 minute goal',legend:legend([{color:C[0],label:'Active in the app'},{color:C[1],label:'Verified focus'}]),
  chart:()=>responsive(width=>{const H=260,ml=40,mr=64,mt=12,mb=28,pw=width-ml-mr,ph=H-mt-mb,mx=35;const Y=v=>mt+ph-v/mx*ph;const svg=s2('svg',{width,height:H,role:'img','aria-label':'Engaged minutes by week'});
   [0,10,20,30].forEach(v=>{svg.append(s2('line',{x1:ml,x2:width-mr,y1:Y(v),y2:Y(v),stroke:v?cssv('--grid'):cssv('--axis')}));svg.append(s2('text',{x:ml-6,y:Y(v)+4,'text-anchor':'end',class:'ax'},v));});
   const band=pw/ENG_WEEKS.length,bw=Math.min(24,band*.6);
   ENG_WEEKS.forEach((w,i)=>{const cx=ml+band*i+band/2,a=ENG_ACTIVE[i],fo=ENG_FOCUS[i];const ha=a/mx*ph,hf=fo/mx*ph;
    svg.append(s2('path',{d:`M${cx-bw/2},${Y(0)}h${bw}v${-Math.max(0,ha-(hf>0?2:0))}h${-bw}Z`,fill:C[0]}));if(hf>0)svg.append(s2('path',{d:barPath(cx-bw/2,Y(a+fo),bw,hf,4),fill:C[1]}));else svg.append(s2('path',{d:barPath(cx-bw/2,Y(a),bw,ha,4),fill:C[0]}));
    svg.append(s2('text',{x:cx,y:H-8,'text-anchor':'middle',class:'ax'},w));
    const hit=s2('rect',{x:ml+band*i,y:mt,width:band,height:ph,fill:'transparent'});hover(hit,w,[{color:C[0],value:a.toFixed(1)+' min',label:'active in the app'},{color:C[1],value:fo.toFixed(1)+' min',label:'verified focus'},{value:(a+fo).toFixed(1)+' min',label:'engaged total'}]);svg.append(hit);});
   svg.append(s2('line',{x1:ml,x2:width-mr,y1:Y(GOAL_MIN),y2:Y(GOAL_MIN),stroke:cssv('--ink2'),'stroke-width':1}));svg.append(s2('text',{x:width-mr+4,y:Y(GOAL_MIN)+4,class:'ax'},'Goal 30'));return svg;}),
  table:()=>table([{h:'Week'},{h:'Active',n:1},{h:'Verified focus',n:1},{h:'Engaged total',n:1}],ENG_WEEKS.map((w,i)=>[w,ENG_ACTIVE[i].toFixed(1),ENG_FOCUS[i].toFixed(1),(ENG_ACTIVE[i]+ENG_FOCUS[i]).toFixed(1)])),
  note:'Week 1 is the 2.15 minute baseline from the brief. Weeks 2 to 8 are dummy values showing the Phase 1 target path. Focus counts only when verified (leave-to-fail).'}));
 f.append(sectionTitle('People behind the number'));
 f.append(h('div',{class:'tiles'},statTile('Weekly active students',WAU[7]+' of 20',h('div',{class:'d'},'Week 1: '+WAU[0]),WAU),statTile('Regular focus users',String(REGULAR[7]),h('div',{class:'d'},'Week 1: '+REGULAR[0]),REGULAR)));
 return f;}
function adoptionView(){const f=h('div',{});f.append(backBtn('Back to overview',()=>go('team')));
 f.append(chartCard({title:'Which features students use',sub:'Share of students who used each area at least once. Baseline from the brief, 30 Aug to 13 Oct 2026.',legend:legend([{color:cssv('--s1'),label:'Last 7 days (of 13 active students)'},{color:cssv('--muted'),label:'Last 45 days (of 20 students)'}]),
  chart:()=>responsive(width=>{const rows=[];ADOPT.forEach(a=>{rows.push({label:a.name,value:a.d7,color:cssv('--s1'),text:rp(a.d7),tipTitle:a.name,tipRows:[{value:rp(a.d7),label:'last 7 days'},{value:rp(a.d45),label:'last 45 days'}]});rows.push({label:'',value:a.d45,color:cssv('--muted'),text:rp(a.d45),tipTitle:a.name,tipRows:[{value:rp(a.d7),label:'last 7 days'},{value:rp(a.d45),label:'last 45 days'}]});});
   return hbars(rows,width,{max:1,bh:13,gap:5,rightW:70,aria:'Feature adoption'});}),
  table:()=>table([{h:'Area'},{h:'Last 7 days',n:1},{h:'Last 45 days',n:1}],ADOPT.map(a=>[a.name,rp(a.d7),rp(a.d45)])),
  note:'Study and Wellness lose students fastest: about two-thirds tried each, but only 2 of 13 active students used either this week.'}));
 return f;}
function scoreRows(p){const len=plen(p);return EVTYPES.map(t=>{let planned=0,held=0,att=0,attPlan=0,rated=0,rsum=0;
  if(t.id==='mentor'){STUDENTS.forEach(x=>x.events.filter(e=>e.type==='mentor'&&daysFrom(e.date)<=0&&daysFrom(e.date)>-len).forEach(e=>{planned++;if(e.held)held++;if(e.attended!=null){attPlan++;if(e.attended)att++;}if(e.rating){rated++;rsum+=e.rating;}}));}
  else{GEV.filter(e=>e.type===t.id&&daysFrom(e.date)<=0&&daysFrom(e.date)>-len).forEach(e=>{planned++;if(e.held)held++;});
   STUDENTS.forEach(x=>x.events.filter(e=>e.type===t.id&&e.attended!=null&&daysFrom(e.date)>-len).forEach(e=>{attPlan++;if(e.attended)att++;if(e.rating){rated++;rsum+=e.rating;}}));}
  return{t,planned,held,att,attPlan,rated,avg:rated?rsum/rated:null,resp:att?rated/att:null};}).filter(r=>r.planned>0);}

   table:()=>table([{h:'Session'},{h:'Planned',n:1},{h:'Held',n:1}],rows.map(r=>[r.t.label,r.planned,r.held])),note:'Orange means at least one planned session did not run. Switch the period to Quarter to see the cancelled workshop.'}),
  chartCard({title:'Quality: did students like it?',sub:'Average rating out of 5, collected with one tap after each session',chart:()=>responsive(width=>hbars(rows.filter(r=>r.avg!=null).map(r=>({label:r.t.label,value:r.avg,color:cssv('--s1'),text:r.avg.toFixed(1)+'  ('+r.rated+' ratings)',tipTitle:r.t.label,tipRows:[{value:r.avg.toFixed(2),label:'average rating'},{value:rp(r.resp),label:'of attendees rated it'}]})),width,{max:5,rightW:130,aria:'Average rating'})),
   table:()=>table([{h:'Session'},{h:'Rating',n:1},{h:'Ratings',n:1},{h:'Share who rated',n:1}],rows.map(r=>[r.t.label,r.avg!=null?r.avg.toFixed(1):'-',r.rated,rp(r.resp)])),note:'Ratings are for the team only. Families never see them.'})));
 f.append(sectionTitle('What students and parents said (dummy, anonymised)'));
 f.append(h('div',{class:'card'},h('ul',{class:'list'},FEEDBACK.map(x=>h('li',{},h('div',{},h('div',{},'"'+x.text+'"'),h('div',{class:'note',style:{margin:'2px 0 0'}},x.who+' on '+x.about)),h('span',{class:'neutral',style:{whiteSpace:'nowrap'}},x.rating+' of 5')))),
  h('div',{class:'note'},'In production this comes from the one-tap rating plus an optional comment box in the app.')));
 return f;}
